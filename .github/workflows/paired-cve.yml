name: Paired CVE gate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  paired-cve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Spotlight
        run: pip install -e ".[dev]"
      - name: Run vulnerable/fixed commit gate
        env:
          SPOTLIGHT_SANDBOX: subprocess
        run: python -m spotlight.eval.paired_cve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-cve-report
          path: Evals/results/latest-paired-cves
