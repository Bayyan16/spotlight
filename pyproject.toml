[project]
name = "spotlight"
version = "0.1.0"
description = "Spotlight by CMUL8 — AI security engineer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "websockets>=13.1",
    "python-multipart>=0.0.12",
    "flask>=3.0",
    "modal>=1.0",
    "cryptography>=42",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.7",
]

[project.scripts]
spotlight = "spotlight.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spotlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
