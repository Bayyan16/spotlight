<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Accent glow top-right -->
  <ellipse cx="1000" cy="150" rx="300" ry="250" fill="url(#glow)"/>

  <!-- Spotlight icon -- stylized search beam -->
  <g transform="translate(80, 80)" filter="url(#shadow)">
    <!-- Lens ring -->
    <circle cx="45" cy="45" r="38" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <!-- Inner lens -->
    <circle cx="45" cy="45" r="28" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
    <!-- Handle -->
    <line x1="70" y1="72" x2="98" y2="100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <!-- Beam -->
    <path d="M 20 25 L -35 -10 L -30 -30 L 40 15 Z" fill="#06b6d4" opacity="0.15"/>
  </g>

  <!-- Main headline -->
  <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-0.5">
    When Closed-Source AI Failed,
  </text>
  <text x="80" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#accent)" letter-spacing="-0.5">
    Open Source Defended.
  </text>

  <!-- Subtitle -->
  <text x="80" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#94a3b8" font-weight="400">
    Spotlight — the autonomous, open-source AI security engineer.
  </text>

  <!-- Bottom bar -->
  <g transform="translate(80, 530)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748b" font-weight="500">
      github.com/CMUL8/spotlight
    </text>
  </g>

  <!-- Right-side decorative bars -->
  <g transform="translate(1080, 80)" opacity="0.5">
    <rect x="0" y="0" width="4" height="80" rx="2" fill="url(#accent)"/>
    <rect x="16" y="10" width="4" height="60" rx="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="32" y="20" width="4" height="40" rx="2" fill="url(#accent)" opacity="0.3"/>
  </g>

  <!-- Bottom tagline pill -->
  <g transform="translate(80, 500)">
    <rect x="0" y="-2" width="250" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="125" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" font-weight="600" text-anchor="middle" letter-spacing="1" text-transform="uppercase">
      MULTI-AGENT  ·  OPEN SOURCE  ·  VERIFIABLE
    </text>
  </g>
</svg>
