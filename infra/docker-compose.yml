services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spotlight
      POSTGRES_PASSWORD: spotlight
      POSTGRES_DB: spotlight
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spotlight
      MINIO_ROOT_PASSWORD: spotlight
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://spotlight:spotlight@postgres:5432/spotlight
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: spotlight
      S3_SECRET_KEY: spotlight
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]

  console:
    build:
      context: ..
      dockerfile: infra/Dockerfile.console
    depends_on: [api]
    ports: ["5173:5173"]

volumes:
  pg_data:
  minio_data:
